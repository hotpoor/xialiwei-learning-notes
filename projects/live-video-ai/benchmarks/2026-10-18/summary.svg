<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><style>text{font-family:system-ui,"PingFang SC",sans-serif;fill:#eaf2ec}.title{font-size:29px;font-weight:700}.label{font-size:22px}.small{font-size:17px;fill:#b8c8c2}</style><rect width="1000" height="470" rx="20" fill="#15221f"/><text x="40" y="55" class="title">3090 第一版 · 实测帧率与用电</text><text x="40" y="90" class="small">2026-10-18 · SD-Turbo · 单路合成图 · strength 0.5 · 预热后测量</text><text x="40" y="150" class="label">256 服务端</text><rect x="240" y="125" width="424" height="36" rx="8" fill="#b6dba4"/><text x="690" y="151" class="label">7.06 FPS</text><text x="40" y="212" class="label">512 服务端</text><rect x="240" y="187" width="245" height="36" rx="8" fill="#82b6a4"/><text x="510" y="213" class="label">4.09 FPS</text><text x="40" y="274" class="label">256 经 SSH</text><rect x="240" y="249" width="332" height="36" rx="8" fill="#d4bf87"/><text x="598" y="275" class="label">5.54 FPS</text><text x="40" y="343" class="label">256：板卡约 248 W → 约 0.248 度电／小时</text><text x="40" y="382" class="small">按 1 元／度示例：约 0.25 元／小时；未含整机其他耗电与折旧</text><text x="40" y="431" class="small">摄像头尚未验证；服务端／客户端数据均不等于摄像头完整显示帧率。</text></svg>