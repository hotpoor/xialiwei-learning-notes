<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:27px;font-weight:700}.t{font-size:22px}.sm{font-size:19px}</style><rect width="1080" height="510" fill="#f3f6fb"/><text x="40" y="55" class="h">第一版按 256 × 256 推进</text><rect x="40" y="90" width="1000" height="155" rx="16" fill="white"/><text x="65" y="135" class="t">摄像头 → 裁剪/缩放 → 模型推理 → 256 × 256 显示</text><text x="65" y="180" class="sm">推理尺寸：256 × 256 实验 / 512 × 512 参考，需要实际比较</text><text x="65" y="218" class="sm">256服务端7.06 FPS，512服务端4.09 FPS；真实摄像头帧率待验收。</text><rect x="40" y="270" width="1000" height="190" rx="16" fill="#e0f2eb"/><text x="65" y="315" class="h">环境、模型与合成图链路已跑通</text><text x="65" y="360" class="t">Windows版本 · NVIDIA驱动 · WSL版本 · 发行版是否为WSL2</text><text x="65" y="407" class="sm">CUDA、单帧、连续图像流已通过 → 摄像头权限与真人画面待确认</text></svg>