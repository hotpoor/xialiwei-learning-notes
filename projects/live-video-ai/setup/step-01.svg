<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:27px;font-weight:700}.t{font-size:22px}.sm{font-size:19px}</style><rect width="1080" height="510" fill="#f3f6fb"/><text x="40" y="55" class="h">200 × 200 可以先作为展示目标</text><rect x="40" y="90" width="1000" height="155" rx="16" fill="white"/><text x="65" y="135" class="t">摄像头 → 裁剪/缩放 → 模型推理 → 200 × 200 显示</text><text x="65" y="180" class="sm">推理尺寸：256 × 256 实验 / 512 × 512 参考，需要实际比较</text><text x="65" y="218" class="sm">显示缩小不等于推理加速；本机真实帧率尚未测得。</text><rect x="40" y="270" width="1000" height="190" rx="16" fill="#e0f2eb"/><text x="65" y="315" class="h">当前只做第 1 步：检查Windows主机</text><text x="65" y="360" class="t">Windows版本 · NVIDIA驱动 · WSL版本 · 发行版是否为WSL2</text><text x="65" y="407" class="sm">检查结果返回后 → 验证GPU → 隔离环境 → 单帧 → 摄像头连续输出</text></svg>