<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1010" viewBox="0 0 1100 1010"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:27px;font-weight:700}.t{font-size:22px}.sm{font-size:19px}</style><rect width="1100" height="1010" fill="#f3f6fb"/><text x="40" y="55" class="h">Live AI：先做实时视频编辑，再逐步训练</text><text x="40" y="100" class="t">目标：摄像头输入 + 提示词 → 改人物、场景或风格（Lucy 类）</text><rect x="40" y="135" width="1020" height="240" rx="16" fill="white"/><text x="65" y="180" class="h">第一版建议：先用现有设备建立实测基线</text><rect x="65" y="210" width="280" height="90" rx="12" fill="#e0f2eb"/><text x="85" y="246" class="t">M1 Max / 浏览器</text><text x="85" y="278" class="sm">摄像头 · 提示词 · 显示</text><text x="365" y="262" class="h">→</text><rect x="415" y="210" width="300" height="90" rx="12" fill="#e5edf9"/><text x="435" y="246" class="t">3090 · Windows + WSL2</text><text x="435" y="278" class="sm">CUDA 推理服务 · 返回画面</text><text x="740" y="262" class="h">→</text><rect x="790" y="210" width="245" height="90" rx="12" fill="#e0f2eb"/><text x="810" y="246" class="t">Mac 浏览器</text><text x="810" y="278" class="sm">查看编辑后的视频</text><text x="65" y="344" class="sm">已跑通合成图：256服务端7.06 FPS，Mac经SSH客户端5.54 FPS；摄像头已跑通。</text><rect x="40" y="400" width="1020" height="245" rx="16" fill="white"/><text x="65" y="445" class="h">DGX Spark 和笔记本怎么定位？</text><text x="65" y="492" class="t">DGX Spark：可探索本地扩散/视频推理，实时能力与 ARM 依赖需验证。</text><text x="65" y="539" class="t">M1 Max 本地：部分扩散可用 MPS；CUDA 方案不能原样照搬。</text><text x="65" y="586" class="t">笔记本做前端：可把摄像头画面交给 3090 或 Spark 推理。</text><text x="65" y="622" class="sm">加载得下 ≠ 运行得快 ≠ 交互延迟低 ≠ 画面连续稳定。</text><rect x="40" y="670" width="1020" height="285" rx="16" fill="#e0f2eb"/><text x="65" y="715" class="h">按成果推进，而不是先把全书学完</text><text x="65" y="762" class="t">1. 预训练模型跑通单帧 → 连续输入、连续输出、可切提示词</text><text x="65" y="809" class="t">2. 测首帧等待 / 端到端延迟 / 有效 FPS / 闪烁与动作保留</text><text x="65" y="856" class="t">3. 对比图像流基线与流式视频模型，找出真正瓶颈</text><text x="65" y="903" class="t">4. 再做小范围 LoRA / 微调；时序与低延迟问题分别解决</text></svg>