<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live AI · 256 实验台</title><style>
*{box-sizing:border-box}body{margin:0;background:#111a1b;color:#eef3ee;font:16px/1.7 system-ui,"PingFang SC",sans-serif}main{max-width:1050px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:28px;margin:0}.sub{color:#a8bdb7}.badge{border:1px solid #63847b;border-radius:30px;padding:7px 15px;color:#bdd9bd}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.metric{background:#20302e;border-radius:12px;padding:14px}.metric strong{display:block;font-size:25px}.views{display:grid;grid-template-columns:1fr 1fr;gap:20px}.view{background:#1b2928;border:1px solid #344a44;border-radius:16px;padding:20px}.screen{height:290px;display:grid;place-items:center;position:relative;background:#101817;border-radius:9px;overflow:hidden}.screen video,.screen img{width:256px;height:256px;object-fit:cover;max-width:100%}.screen img:not([src]){visibility:hidden}.placeholder{position:absolute;color:#96aaa5;pointer-events:none}.controls{padding:22px;background:#1b2928;border-radius:16px;margin-top:20px}label{display:block;margin-bottom:8px}textarea,select,button,input{font:inherit}textarea{width:100%;background:#101c1a;color:#eef3ee;border:1px solid #5b746b;border-radius:9px;padding:12px;resize:vertical;min-height:80px}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:15px}button{padding:10px 20px;border-radius:9px;border:0;background:#c1e2af;color:#163028;cursor:pointer;font-weight:650}button.secondary{background:#30463f;color:#eef3ee}button:disabled{opacity:.5;cursor:default}select{padding:9px;background:#243b33;color:#fff;border:1px solid #5b746b;border-radius:9px}.note{font-size:13px;color:#a8bdb7}#message{min-height:28px;color:#d7e8ae}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #f3c979;outline-offset:3px}@media(max-width:650px){.views{grid-template-columns:1fr}.metrics{gap:7px}.metric{font-size:12px;padding:10px}.metric strong{font-size:20px}main{padding:20px 12px}.screen{height:270px}header{align-items:flex-start}h1{font-size:23px}}</style></head><body><main>
<header><div><h1>Live AI · 256 实验台</h1><div class="sub">摄像头实时风格转换 · RTX 3090</div></div><span id="status" class="badge">连接中</span></header>
<div class="metrics"><div class="metric">处理后有效 FPS<strong id="fps">—</strong></div><div class="metric">往返处理延迟<strong id="latency">—</strong></div><div class="metric">服务端模型耗时<strong id="inference">—</strong></div></div>
<div class="views"><section class="view"><h2>摄像头输入</h2><div class="screen"><video id="camera" autoplay muted playsinline></video><span class="placeholder" id="input-placeholder">点击“开启摄像头”后显示</span></div></section><section class="view"><h2>风格输出</h2><div class="screen"><img id="output" alt="AI 风格转换结果"><span class="placeholder" id="output-placeholder">模型就绪并开始转换后显示</span></div></section></div>
<section class="controls"><label for="prompt">风格提示词（先用英文）</label><textarea id="prompt">watercolor portrait painting, soft pastel colors, delicate paper texture, artistic illustration</textarea><div class="row"><label for="resolution">模型推理尺寸</label><select id="resolution"><option value="256">256 × 256（先试）</option><option value="512">512 × 512（画质参考）</option></select><label for="strength">变换强度</label><select id="strength"><option value="0.5">0.5 · 保留更多原画面</option><option value="1.0">1.0 · 较强（可能改变主体）</option></select></div><div class="row"><button id="start" disabled>开启摄像头</button><button id="stop" class="secondary" disabled>停止</button><button id="apply" class="secondary">应用提示词</button></div><p id="message" role="status" aria-live="polite">正在检查模型状态……首次加载可能需要下载权重。</p><div class="note">摄像头由你点击开启；画面发送到自己的 3090 推理服务，不保存帧。固定随机种子仅减少随机波动，不保证视频时序一致性。这里的延迟不包含摄像头硬件采集和屏幕扫描耗时。首版是图像流基线。</div></section>
</main><script>
const $=s=>document.querySelector(s);let active=false,stream=null,ws=null,frameId=0,sentAt=0,lastShown=0,runId=0,appliedPrompt=$('#prompt').value,failures=0,previousHealth='';const canvas=document.createElement('canvas');let healthTimer;
async function checkHealth(){try{const r=await fetch('/health');const h=await r.json();$('#status').textContent=h.status==='ready'?(active?'实时转换中':'模型就绪'):h.status==='error'?'加载失败':'加载模型中';$('#start').disabled=h.status!=='ready'||active;if(h.status==='error')$('#message').textContent='模型加载失败：'+h.error;else if(h.status==='ready'&&!active)$('#message').textContent='模型已就绪。点击“开启摄像头”，开始实时转换。'}catch(e){$('#status').textContent='服务未连接';$('#start').disabled=true;previousHealth='offline';if(!active)$('#message').textContent='推理服务尚未连接。请先启动3090上的服务，并通过localhost访问。'}}healthTimer=setInterval(checkHealth,2500);checkHealth();
$('#apply').onclick=()=>{const value=$('#prompt').value.trim();if(!value){$('#message').textContent='请先填写提示词。';return}appliedPrompt=value;$('#message').textContent='提示词已应用，从下一帧开始使用。'};
function stop(){active=false;runId++;if(ws){ws.onclose=null;ws.close();ws=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#camera').srcObject=null;$('#input-placeholder').style.display='';$('#stop').disabled=true;$('#message').textContent='已停止采集与转换。';$('#status').textContent='已停止';checkHealth()}
$('#stop').onclick=stop;
async function sendFrame(token){if(!active||token!==runId||!ws||ws.readyState!==1)return;try{const v=$('#camera');if(v.readyState<2){setTimeout(()=>sendFrame(token),50);return}const size=Number($('#resolution').value);canvas.width=size;canvas.height=size;const side=Math.min(v.videoWidth,v.videoHeight);canvas.getContext('2d').drawImage(v,(v.videoWidth-side)/2,(v.videoHeight-side)/2,side,side,0,0,size,size);const image=canvas.toDataURL('image/jpeg',.86).split(',')[1];sentAt=performance.now();ws.send(JSON.stringify({image,prompt:appliedPrompt,resolution:size,strength:Number($('#strength').value),frame_id:++frameId}));}catch(e){$('#message').textContent='发送失败：'+e.message;stop()}}
$('#start').onclick=async()=>{if(active)return;$('#start').disabled=true;try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('摄像头需要 localhost 或受信任的 HTTPS 页面');stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:512},height:{ideal:512},frameRate:{ideal:30}},audio:false});$('#camera').srcObject=stream;await $('#camera').play();$('#input-placeholder').style.display='none';active=true;failures=0;const token=++runId;ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');$('#stop').disabled=false;ws.onopen=()=>{$('#status').textContent='实时转换中';$('#message').textContent='正在处理画面；提示词修改后点击应用。';lastShown=0;sendFrame(token)};ws.onmessage=async event=>{if(!active||token!==runId)return;const data=JSON.parse(event.data);if(data.error){$('#message').textContent='处理失败：'+data.error;if(++failures>=3){stop();$('#message').textContent='连续处理失败，已停止：'+data.error;return}setTimeout(()=>sendFrame(token),200);return}failures=0;const now=performance.now();$('#latency').textContent=Math.round(now-sentAt)+' ms';$('#inference').textContent=data.infer_ms+' ms';const out=$('#output');out.src='data:image/jpeg;base64,'+data.image;try{await out.decode()}catch(e){}if(!active||token!==runId)return;const shown=performance.now();$('#fps').textContent=lastShown?(1000/(shown-lastShown)).toFixed(1):'预热中';lastShown=shown;$('#output-placeholder').style.display='none';requestAnimationFrame(()=>sendFrame(token))};ws.onerror=()=>{$('#message').textContent='视频连接错误，请检查服务状态。'};ws.onclose=()=>{if(active){stop();$('#message').textContent='推理连接已关闭，可重新开启。'}};}catch(e){stop();$('#message').textContent='摄像头未开启：'+e.message}};
window.addEventListener('pagehide',()=>{clearInterval(healthTimer);stop()});
</script></body></html>
