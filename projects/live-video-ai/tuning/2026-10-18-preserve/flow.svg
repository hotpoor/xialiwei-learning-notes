<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460"><style>text{font-family:system-ui,"PingFang SC",sans-serif;fill:#e8f2e9}.h{font-size:28px;font-weight:700}.t{font-size:21px}.s{font-size:18px;fill:#b7cdc1}</style><rect width="1000" height="460" rx="20" fill="#16251f"/><text x="35" y="53" class="h">保留原貌：当前画面为主体，只叠加轻微画风</text><rect x="35" y="90" width="930" height="80" rx="12" fill="#30483c"/><text x="60" y="124" class="t">当前摄像头帧 → 低噪声单步重绘 → 提取小幅风格差异</text><text x="60" y="154" class="s">原图的脸、轮廓与动作留在当前帧；不是完全替换成模型画面</text><rect x="35" y="193" width="450" height="105" rx="12" fill="#30483c"/><text x="60" y="232" class="t">静止区域：平滑风格差异</text><text x="60" y="270" class="s">减少轻微输入扰动导致的风格跳变</text><rect x="510" y="193" width="455" height="105" rx="12" fill="#30483c"/><text x="535" y="232" class="t">运动区域：减少历史混合</text><text x="535" y="270" class="s">避免旧风格追着动作拖影</text><text x="40" y="353" class="t">原图 + 限幅后的轻微风格残差 → 输出</text><text x="40" y="396" class="s">默认风格很淡；这是保留原貌优先的折中，不是人脸身份锁定。</text><text x="40" y="433" class="s">模型仍为 SD-Turbo；连接、提示词、尺寸改变时清除旧历史。</text></svg>