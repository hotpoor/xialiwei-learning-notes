<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="865" viewBox="0 0 1080 865"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:27px;font-weight:700}.t{font-size:22px}.sm{font-size:19px}</style><rect width="1080" height="865" fill="#f3f6fb"/><text x="45" y="60" class="h">5 折交叉验证：轮流验证，再汇总结果</text><text x="45" y="105" class="t">先保留最终测试集；将开发数据分成 5 份，每轮用 4 份训练、1 份验证</text><rect x="40" y="135" width="1000" height="440" rx="16" fill="white"/><text x="240" y="180" class="t">第 1 份</text><text x="395" y="180" class="t">第 2 份</text><text x="550" y="180" class="t">第 3 份</text><text x="705" y="180" class="t">第 4 份</text><text x="860" y="180" class="t">第 5 份</text><text x="65" y="238" class="t">第 1 轮</text><rect x="220" y="205" width="135" height="48" rx="8" fill="#f6c68f"/><text x="287" y="237" text-anchor="middle" class="t">验证</text><rect x="375" y="205" width="135" height="48" rx="8" fill="#d7eee7"/><text x="442" y="237" text-anchor="middle" class="t">训练</text><rect x="530" y="205" width="135" height="48" rx="8" fill="#d7eee7"/><text x="597" y="237" text-anchor="middle" class="t">训练</text><rect x="685" y="205" width="135" height="48" rx="8" fill="#d7eee7"/><text x="752" y="237" text-anchor="middle" class="t">训练</text><rect x="840" y="205" width="135" height="48" rx="8" fill="#d7eee7"/><text x="907" y="237" text-anchor="middle" class="t">训练</text><text x="65" y="303" class="t">第 2 轮</text><rect x="220" y="270" width="135" height="48" rx="8" fill="#d7eee7"/><text x="287" y="302" text-anchor="middle" class="t">训练</text><rect x="375" y="270" width="135" height="48" rx="8" fill="#f6c68f"/><text x="442" y="302" text-anchor="middle" class="t">验证</text><rect x="530" y="270" width="135" height="48" rx="8" fill="#d7eee7"/><text x="597" y="302" text-anchor="middle" class="t">训练</text><rect x="685" y="270" width="135" height="48" rx="8" fill="#d7eee7"/><text x="752" y="302" text-anchor="middle" class="t">训练</text><rect x="840" y="270" width="135" height="48" rx="8" fill="#d7eee7"/><text x="907" y="302" text-anchor="middle" class="t">训练</text><text x="65" y="368" class="t">第 3 轮</text><rect x="220" y="335" width="135" height="48" rx="8" fill="#d7eee7"/><text x="287" y="367" text-anchor="middle" class="t">训练</text><rect x="375" y="335" width="135" height="48" rx="8" fill="#d7eee7"/><text x="442" y="367" text-anchor="middle" class="t">训练</text><rect x="530" y="335" width="135" height="48" rx="8" fill="#f6c68f"/><text x="597" y="367" text-anchor="middle" class="t">验证</text><rect x="685" y="335" width="135" height="48" rx="8" fill="#d7eee7"/><text x="752" y="367" text-anchor="middle" class="t">训练</text><rect x="840" y="335" width="135" height="48" rx="8" fill="#d7eee7"/><text x="907" y="367" text-anchor="middle" class="t">训练</text><text x="65" y="433" class="t">第 4 轮</text><rect x="220" y="400" width="135" height="48" rx="8" fill="#d7eee7"/><text x="287" y="432" text-anchor="middle" class="t">训练</text><rect x="375" y="400" width="135" height="48" rx="8" fill="#d7eee7"/><text x="442" y="432" text-anchor="middle" class="t">训练</text><rect x="530" y="400" width="135" height="48" rx="8" fill="#d7eee7"/><text x="597" y="432" text-anchor="middle" class="t">训练</text><rect x="685" y="400" width="135" height="48" rx="8" fill="#f6c68f"/><text x="752" y="432" text-anchor="middle" class="t">验证</text><rect x="840" y="400" width="135" height="48" rx="8" fill="#d7eee7"/><text x="907" y="432" text-anchor="middle" class="t">训练</text><text x="65" y="498" class="t">第 5 轮</text><rect x="220" y="465" width="135" height="48" rx="8" fill="#d7eee7"/><text x="287" y="497" text-anchor="middle" class="t">训练</text><rect x="375" y="465" width="135" height="48" rx="8" fill="#d7eee7"/><text x="442" y="497" text-anchor="middle" class="t">训练</text><rect x="530" y="465" width="135" height="48" rx="8" fill="#d7eee7"/><text x="597" y="497" text-anchor="middle" class="t">训练</text><rect x="685" y="465" width="135" height="48" rx="8" fill="#d7eee7"/><text x="752" y="497" text-anchor="middle" class="t">训练</text><rect x="840" y="465" width="135" height="48" rx="8" fill="#f6c68f"/><text x="907" y="497" text-anchor="middle" class="t">验证</text><rect x="40" y="600" width="1000" height="215" rx="16" fill="#e0f2eb"/><text x="65" y="645" class="h">每轮重新训练一个模型，不是同一个模型接着训练。</text><text x="65" y="690" class="t">每个样本：当 1 次验证数据、当 4 次训练数据。</text><text x="65" y="735" class="t">汇总 5 轮验证成绩；比较 A、B 时使用相同划分。</text><text x="65" y="780" class="sm">最终测试集不参与这些轮次，也不用来选参数；选定方案后再评估。</text></svg>