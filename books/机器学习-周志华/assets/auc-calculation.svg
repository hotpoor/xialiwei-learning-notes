<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1330" viewBox="0 0 1100 1330">
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.title{font-size:30px;font-weight:700}.h{font-size:23px;font-weight:600}.t{font-size:21px}.sm{font-size:18px}.m{fill:#5c6b80}.green{fill:#087d69}</style>
<rect width="1100" height="1330" fill="#f3f6fb"/>
<text x="45" y="55" class="title">AUC 怎么算？同一个例子，两种算法</text>
<text x="45" y="94" class="t m">坏瓜为正类｜分数越高，越认为是坏瓜｜预测规则：分数 ≥ 阈值就报出</text>
<rect x="40" y="120" width="1020" height="180" rx="16" fill="white"/>
<text x="65" y="158" class="h">① 先把 4 个瓜按模型分数，从高到低排列</text>
<text x="125" y="210" class="t">瓜 A：0.9</text><text x="375" y="210" class="t">瓜 B：0.8</text><text x="625" y="210" class="t">瓜 C：0.7</text><text x="875" y="210" class="t">瓜 D：0.1</text>
<text x="125" y="254" class="h green">实际：坏</text><text x="375" y="254" class="h">实际：好</text><text x="625" y="254" class="h green">实际：坏</text><text x="875" y="254" class="h">实际：好</text>
<rect x="40" y="320" width="1020" height="315" rx="16" fill="white"/>
<text x="65" y="360" class="h">② 逐渐降低阈值，每次多报出一个瓜</text>
<path d="M65 420H1035 M65 462H1035 M65 504H1035 M65 546H1035 M65 588H1035" stroke="#e1e7ef"/>
<text x="80" y="402" class="sm m">阈值</text><text x="250" y="402" class="sm m">报出的瓜</text><text x="505" y="402" class="sm m">误报好瓜 / 2 = FPR</text><text x="795" y="402" class="sm m">找出坏瓜 / 2 = TPR</text>
<text x="80" y="450" class="t">大于 0.9</text><text x="250" y="450" class="t">无</text><text x="540" y="450" class="t">0 / 2 = 0</text><text x="830" y="450" class="t">0 / 2 = 0</text>
<text x="80" y="492" class="t">0.9</text><text x="250" y="492" class="t">A</text><text x="540" y="492" class="t">0 / 2 = 0</text><text x="830" y="492" class="t">1 / 2 = 0.5</text>
<text x="80" y="534" class="t">0.8</text><text x="250" y="534" class="t">A、B</text><text x="540" y="534" class="t">1 / 2 = 0.5</text><text x="830" y="534" class="t">1 / 2 = 0.5</text>
<text x="80" y="576" class="t">0.7</text><text x="250" y="576" class="t">A、B、C</text><text x="540" y="576" class="t">1 / 2 = 0.5</text><text x="830" y="576" class="t">2 / 2 = 1</text>
<text x="80" y="618" class="t">0.1</text><text x="250" y="618" class="t">A、B、C、D</text><text x="540" y="618" class="t">2 / 2 = 1</text><text x="830" y="618" class="t">2 / 2 = 1</text>
<rect x="40" y="655" width="1020" height="355" rx="16" fill="white"/>
<text x="65" y="696" class="h">③ 把 (FPR, TPR) 画出来，计算曲线下的面积</text>
<rect x="140" y="840" width="150" height="110" fill="#c2eadd"/><rect x="290" y="730" width="150" height="220" fill="#9ed8c5"/>
<path d="M140 730V950H440" stroke="#54647a" fill="none" stroke-width="2"/>
<path d="M140 950V840H290V730H440" stroke="#087d69" fill="none" stroke-width="4"/>
<g fill="#087d69"><circle cx="140" cy="950" r="5"/><circle cx="140" cy="840" r="5"/><circle cx="290" cy="840" r="5"/><circle cx="290" cy="730" r="5"/><circle cx="440" cy="730" r="5"/></g>
<text x="115" y="977" class="sm">0</text><text x="275" y="977" class="sm">0.5</text><text x="435" y="977" class="sm">1</text><text x="98" y="845" class="sm">0.5</text><text x="110" y="736" class="sm">1</text>
<text x="195" y="903" class="h">0.25</text><text x="339" y="858" class="h">0.50</text><text x="450" y="955" class="sm">FPR →</text><text x="76" y="770" class="sm">TPR ↑</text>
<text x="590" y="765" class="t">左侧面积 = 0.5 × 0.5 = 0.25</text><text x="590" y="810" class="t">右侧面积 = 0.5 × 1 = 0.50</text>
<text x="590" y="870" class="title green">AUC = 0.25 + 0.50 = 0.75</text><text x="590" y="920" class="sm m">竖直线段没有宽度，不增加面积。</text><text x="590" y="952" class="sm m">坐标用 0～1 计算，整个正方形面积为 1。</text>
<rect x="40" y="1030" width="1020" height="255" rx="16" fill="white"/>
<text x="65" y="1070" class="h">④ 另一种算法：每个坏瓜，分别与每个好瓜比较分数</text>
<text x="90" y="1120" class="t">A（坏，0.9）&gt; B（好，0.8） ✓</text><text x="590" y="1120" class="t">A（坏，0.9）&gt; D（好，0.1） ✓</text>
<text x="90" y="1167" class="t">C（坏，0.7）&lt; B（好，0.8） ✗</text><text x="590" y="1167" class="t">C（坏，0.7）&gt; D（好，0.1） ✓</text>
<text x="90" y="1230" class="h green">4 对中排对 3 对 → AUC = 3 / 4 = 0.75</text><text x="90" y="1264" class="sm m">分数相同的一对，按排对半次计算。</text>
</svg>