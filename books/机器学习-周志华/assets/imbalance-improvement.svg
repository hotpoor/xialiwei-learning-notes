<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:27px;font-weight:700}.t{font-size:22px}.sm{font-size:19px}</style><rect width="1080" height="640" fill="#f3f6fb"/><text x="45" y="60" class="h">找到的坏瓜一样多，复查工作却大幅减少</text><text x="45" y="103" class="t">同一批：10 个坏瓜 + 990 个好瓜｜报出的瓜全部交给人工复查</text><rect x="40" y="135" width="1000" height="315" rx="16" fill="white"/><text x="65" y="180" class="t">改进前：108 个待复查</text><rect x="65" y="205" width="75" height="54" rx="4" fill="#37aa86"/><rect x="140" y="205" width="825" height="54" rx="4" fill="#f5ba79"/><text x="80" y="242" class="sm">9 坏</text><text x="450" y="242" class="t">99 个误报好瓜</text><text x="65" y="310" class="t">改进后：18 个待复查</text><rect x="65" y="335" width="75" height="54" rx="4" fill="#37aa86"/><rect x="140" y="335" width="75" height="54" rx="4" fill="#f5ba79"/><text x="80" y="372" class="sm">9 坏</text><text x="155" y="372" class="sm">9 好</text><text x="250" y="372" class="t">两条长度使用相同比例</text><text x="65" y="427" class="sm">绿色：找到的坏瓜　橙色：误报的好瓜　两种方案都仍漏掉 1 个坏瓜</text><rect x="40" y="475" width="1000" height="125" rx="16" fill="#e0f2eb"/><text x="65" y="520" class="h">查全率：90% → 90%　查准率：约 8.3% → 50%</text><text x="65" y="565" class="t">复查数量减少约 83.3%，但查全率并没有提高。</text></svg>