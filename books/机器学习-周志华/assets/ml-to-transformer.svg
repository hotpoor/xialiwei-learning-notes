<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="710" viewBox="0 0 1080 710"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:27px;font-weight:700}.t{font-size:22px}.sm{font-size:19px}</style><rect width="1080" height="710" fill="#f3f6fb"/><text x="40" y="55" class="h">西瓜书 → Transformer → LLM：基础相通，新增内容很多</text><rect x="40" y="90" width="1000" height="145" rx="16" fill="#e0f2eb"/><text x="65" y="135" class="h">共同基础：从数据中学习，通过目标任务检验泛化</text><text x="65" y="180" class="t">训练与评估边界 · 损失函数 · 优化 · 泛化 · 错误代价</text><text x="65" y="215" class="sm">这些问题到了大语言模型仍然存在，具体方法和指标需要匹配任务。</text><rect x="40" y="260" width="475" height="255" rx="16" fill="white"/><text x="65" y="305" class="h">书中典型入门例子</text><text x="65" y="355" class="t">色泽、根蒂、敲声 → 判断好坏</text><text x="65" y="400" class="t">借小数据和多种算法理解学习</text><text x="65" y="450" class="sm">分类例子可看准确率、P/R、AUC</text><text x="65" y="485" class="sm">回归例子可看MAE、MSE等</text><rect x="565" y="260" width="475" height="255" rx="16" fill="white"/><text x="590" y="305" class="h">常见自回归 LLM 路线</text><text x="590" y="355" class="t">文本 → token → 向量表示</text><text x="590" y="400" class="t">Transformer → 预测下一个token</text><text x="590" y="450" class="sm">新补：注意力、预训练与后训练</text><text x="590" y="485" class="sm">还要按生成、检索等实际任务评估</text><rect x="40" y="540" width="1000" height="125" rx="16" fill="white"/><text x="65" y="585" class="h">理解与应用路线：学习基础 + 神经网络 + LLM 专题 + 实际评估</text><text x="65" y="630" class="sm">Transformer是一种神经网络架构，LLM是一类大规模语言模型，两者不是同义词。</text></svg>