<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="830" viewBox="0 0 1080 830"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:26px;font-weight:700}.t{font-size:22px}.sm{font-size:19px}</style><rect width="1080" height="830" fill="#f3f6fb"/><text x="45" y="60" class="h">AUC 一样，使用相同阈值的结果却不同</text><text x="45" y="100" class="t">坏瓜为正类｜分数越高越像坏瓜｜分数 ≥ 0.5 就报出</text><rect x="40" y="130" width="1000" height="330" rx="16" fill="white"/><path d="M40 200H1040 M40 265H1040 M40 330H1040 M40 395H1040 M250 130V460 M640 130V460" stroke="#dce3ed"/><text x="80" y="175" class="t">实际类别</text><text x="300" y="175" class="t">模型 A 分数 → 预测</text><text x="680" y="175" class="t">模型 B 分数 → 预测</text><text x="80" y="243" class="t">坏瓜 1</text><text x="300" y="243" class="t">0.90 → 坏瓜</text><text x="680" y="243" class="t">0.49 → 好瓜</text><text x="80" y="308" class="t">坏瓜 2</text><text x="300" y="308" class="t">0.80 → 坏瓜</text><text x="680" y="308" class="t">0.48 → 好瓜</text><text x="80" y="373" class="t">好瓜 1</text><text x="300" y="373" class="t">0.20 → 好瓜</text><text x="680" y="373" class="t">0.12 → 好瓜</text><text x="80" y="438" class="t">好瓜 2</text><text x="300" y="438" class="t">0.10 → 好瓜</text><text x="680" y="438" class="t">0.11 → 好瓜</text><rect x="40" y="480" width="1000" height="160" rx="16" fill="#e0f2eb"/><text x="65" y="520" class="h">排序：两者都把所有坏瓜排在好瓜前面 → AUC 都为 1</text><text x="65" y="565" class="t">模型 A：找出 2 / 2 个坏瓜 → 查全率 100%</text><text x="65" y="610" class="t">模型 B：找出 0 / 2 个坏瓜 → 查全率 0%</text><rect x="40" y="660" width="1000" height="130" rx="16" fill="white"/><text x="65" y="705" class="h">三个不同问题</text><text x="65" y="748" class="sm">AUC：谁排前面？　阈值：报出哪些？　概率校准：声称 80%，实际接近 80% 吗？</text></svg>