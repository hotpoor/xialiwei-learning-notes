<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1030" viewBox="0 0 1080 1030"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:26px;font-weight:700}.t{font-size:21px}.s{font-size:18px}</style><rect width="1080" height="1030" fill="#f3f6fb"/><text x="40" y="55" class="h">AUC 的三种排序：1、0.5、0</text><text x="40" y="95" class="t">坏瓜是正类｜越靠左分数越高｜每个坏瓜分别与两个好瓜比较，共 4 对</text><rect x="35" y="125" width="1010" height="215" rx="16" fill="white"/><text x="60" y="162" class="h">AUC = 1：全部排对</text><rect x="65" y="185" width="125" height="65" rx="12" fill="#d9f2e7"/><text x="127" y="227" text-anchor="middle" class="h">坏</text><rect x="215" y="185" width="125" height="65" rx="12" fill="#d9f2e7"/><text x="277" y="227" text-anchor="middle" class="h">坏</text><rect x="365" y="185" width="125" height="65" rx="12" fill="#e6ecf5"/><text x="427" y="227" text-anchor="middle" class="h">好</text><rect x="515" y="185" width="125" height="65" rx="12" fill="#e6ecf5"/><text x="577" y="227" text-anchor="middle" class="h">好</text><text x="710" y="226" class="t">4 对排对 / 4 对 = 1</text><text x="65" y="285" class="s">分数：0.9　　　　　0.8　　　　　0.7　　　　　0.1</text><text x="65" y="320" class="s">说明：当前数据上，所有坏瓜的分数都高于好瓜。</text><rect x="35" y="360" width="1010" height="215" rx="16" fill="white"/><text x="60" y="397" class="h">AUC = 0.5：排对一半</text><rect x="65" y="420" width="125" height="65" rx="12" fill="#d9f2e7"/><text x="127" y="462" text-anchor="middle" class="h">坏</text><rect x="215" y="420" width="125" height="65" rx="12" fill="#e6ecf5"/><text x="277" y="462" text-anchor="middle" class="h">好</text><rect x="365" y="420" width="125" height="65" rx="12" fill="#e6ecf5"/><text x="427" y="462" text-anchor="middle" class="h">好</text><rect x="515" y="420" width="125" height="65" rx="12" fill="#d9f2e7"/><text x="577" y="462" text-anchor="middle" class="h">坏</text><text x="710" y="461" class="t">2 对排对 / 4 对 = 0.5</text><text x="65" y="520" class="s">分数：0.9　　　　　0.8　　　　　0.7　　　　　0.1</text><text x="65" y="555" class="s">说明：此例配对胜率为一半；不代表每个阈值都没有用。</text><rect x="35" y="595" width="1010" height="215" rx="16" fill="white"/><text x="60" y="632" class="h">AUC = 0：全部排反</text><rect x="65" y="655" width="125" height="65" rx="12" fill="#e6ecf5"/><text x="127" y="697" text-anchor="middle" class="h">好</text><rect x="215" y="655" width="125" height="65" rx="12" fill="#e6ecf5"/><text x="277" y="697" text-anchor="middle" class="h">好</text><rect x="365" y="655" width="125" height="65" rx="12" fill="#d9f2e7"/><text x="427" y="697" text-anchor="middle" class="h">坏</text><rect x="515" y="655" width="125" height="65" rx="12" fill="#d9f2e7"/><text x="577" y="697" text-anchor="middle" class="h">坏</text><text x="710" y="696" class="t">0 对排对 / 4 对 = 0</text><text x="65" y="755" class="s">分数：0.9　　　　　0.8　　　　　0.7　　　　　0.1</text><text x="65" y="790" class="s">说明：当前数据上，所有坏瓜的分数都低于好瓜。</text><rect x="35" y="845" width="1010" height="150" rx="16" fill="#e3f2ee"/><text x="60" y="885" class="h">分数方向反了怎么办？</text><text x="60" y="928" class="t">把分数改为负数（s → −s），原来低分的瓜就排到前面。</text><text x="60" y="966" class="t">同一批数据、同分按半次计时：新 AUC = 1 − 原 AUC。</text></svg>