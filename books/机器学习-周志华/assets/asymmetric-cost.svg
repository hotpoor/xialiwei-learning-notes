<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:27px;font-weight:700}.t{font-size:22px}.sm{font-size:19px}</style><rect width="1080" height="760" fill="#f3f6fb"/><text x="45" y="60" class="h">如果高估与低估，代价不一样呢？</text><text x="45" y="105" class="t">教学假设：每低估 1 kg 损失 10 元；每高估 1 kg 损失 2 元</text><rect x="40" y="135" width="1000" height="310" rx="16" fill="white"/><text x="70" y="185" class="t">预测情况</text><text x="400" y="185" class="t">绝对误差</text><text x="750" y="185" class="t">实际损失</text><path d="M65 210H1015 M65 305H1015" stroke="#dce3ed"/><text x="70" y="270" class="t">低估 2 kg（误差 −2）</text><text x="400" y="270" class="t">2 kg</text><text x="750" y="270" class="t">2 × 10 = 20 元</text><text x="70" y="365" class="t">高估 2 kg（误差 +2）</text><text x="400" y="365" class="t">2 kg</text><text x="750" y="365" class="t">2 × 2 = 4 元</text><text x="70" y="415" class="sm">MAE、MSE 对相同大小的正负误差一视同仁；本例的真实成本不是这样。</text><rect x="40" y="470" width="1000" height="240" rx="16" fill="#e0f2eb"/><text x="65" y="515" class="h">把实际代价写进评价规则</text><text x="65" y="560" class="t">低估损失 = 10 × 低估的 kg 数</text><text x="65" y="605" class="t">高估损失 = 2 × 高估的 kg 数</text><text x="65" y="660" class="t">每个样本先算损失，再求平均 → 平均成本（元）</text></svg>