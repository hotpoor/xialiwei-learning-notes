<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="730" viewBox="0 0 1080 730"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:27px;font-weight:700}.t{font-size:22px}.sm{font-size:19px}</style><rect width="1080" height="730" fill="#f3f6fb"/><text x="45" y="60" class="h">MAE 与 MSE：同一批预测，可能选出不同模型</text><text x="45" y="104" class="t">两个瓜实际都重 5 kg｜误差 = 预测 − 实际</text><rect x="40" y="135" width="1000" height="340" rx="16" fill="white"/><text x="65" y="185" class="t">比较项目</text><text x="430" y="185" class="h">模型 C</text><text x="770" y="185" class="h">模型 D</text><path d="M65 210H1015 M65 290H1015 M65 370H1015" stroke="#dce3ed"/><text x="65" y="255" class="t">预测重量</text><text x="430" y="255" class="t">3、7 kg</text><text x="770" y="255" class="t">5、8 kg</text><text x="65" y="335" class="t">误差</text><text x="430" y="335" class="t">−2、+2 kg</text><text x="770" y="335" class="t">0、+3 kg</text><text x="65" y="415" class="t">MAE：绝对值平均</text><text x="430" y="415" class="t">(2 + 2) / 2 = 2</text><text x="770" y="415" class="t">(0 + 3) / 2 = 1.5</text><rect x="40" y="495" width="1000" height="185" rx="16" fill="#e0f2eb"/><text x="65" y="540" class="h">MAE 认为 D 更好：平均绝对误差更小。</text><text x="65" y="585" class="t">MSE 会对误差先平方，大误差的影响增长更快。</text><text x="65" y="632" class="t">轮到你：分别计算 C、D 的 MSE，它会更偏好哪个？</text></svg>