<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="830" viewBox="0 0 1080 830"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:27px;font-weight:700}.t{font-size:22px}.sm{font-size:19px}</style><rect width="1080" height="830" fill="#f3f6fb"/><text x="45" y="60" class="h">预测西瓜重量：误差怎样打分？</text><text x="45" y="105" class="t">预测误差 e = 预测值 − 实际值｜正数：高估；负数：低估</text><rect x="40" y="135" width="1000" height="300" rx="16" fill="white"/><text x="80" y="185" class="t">西瓜</text><text x="270" y="185" class="t">实际 kg</text><text x="470" y="185" class="t">预测 kg</text><text x="680" y="185" class="t">误差 kg</text><text x="870" y="185" class="t">误差平方 kg²</text><text x="80" y="255" class="t">A</text><text x="270" y="255" class="t">3</text><text x="470" y="255" class="t">4</text><text x="680" y="255" class="t">+1</text><text x="870" y="255" class="t">1</text><text x="80" y="320" class="t">B</text><text x="270" y="320" class="t">5</text><text x="470" y="320" class="t">4</text><text x="680" y="320" class="t">−1</text><text x="870" y="320" class="t">1</text><text x="80" y="385" class="t">C</text><text x="270" y="385" class="t">4</text><text x="470" y="385" class="t">6</text><text x="680" y="385" class="t">+2</text><text x="870" y="385" class="t">4</text><path d="M65 210H1015" stroke="#dce3ed"/><rect x="40" y="455" width="1000" height="150" rx="16" fill="#fff0df"/><text x="65" y="500" class="h">直接平均：(+1 − 1 + 2) ÷ 3 ≈ 0.67 kg</text><text x="65" y="545" class="t">高估和低估会相互抵消，不能代表整体误差大小。</text><text x="65" y="580" class="sm">例如误差 +10 kg 和 −10 kg，平均为 0，但预测显然不准确。</text><rect x="40" y="625" width="1000" height="160" rx="16" fill="#e0f2eb"/><text x="65" y="670" class="h">MSE：先平方，再求平均，避免正负抵消</text><text x="65" y="718" class="t">均方误差 = (1² + (−1)² + 2²) ÷ 3 = 2 kg²</text><text x="65" y="760" class="t">RMSE：再开平方，回到原单位 → √2 ≈ 1.41 kg</text></svg>