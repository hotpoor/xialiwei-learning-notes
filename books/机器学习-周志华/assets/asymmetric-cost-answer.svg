<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="550" viewBox="0 0 1080 550"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:27px;font-weight:700}.t{font-size:23px}.sm{font-size:20px}</style><rect width="1080" height="550" fill="#f3f6fb"/><text x="45" y="60" class="h">你的计算结果：误差更小，不一定成本更低</text><text x="45" y="105" class="sm">低估 1 kg 损失 10 元｜高估 1 kg 损失 2 元｜实际重量均为 5 kg</text><rect x="40" y="135" width="1000" height="235" rx="16" fill="white"/><text x="75" y="185" class="t">模型</text><text x="260" y="185" class="t">误差（kg）</text><text x="540" y="185" class="t">MAE（kg）</text><text x="790" y="185" class="t">平均成本（元）</text><path d="M65 210H1015 M65 285H1015" stroke="#dce3ed"/><text x="75" y="260" class="t">E</text><text x="260" y="260" class="t">−1、0</text><text x="540" y="260" class="t">0.5 ← 更小</text><text x="790" y="260" class="t">5</text><text x="75" y="337" class="t">F</text><text x="260" y="337" class="t">+1、+1</text><text x="540" y="337" class="t">1</text><text x="790" y="337" class="t">2 ← 更低</text><rect x="40" y="395" width="1000" height="110" rx="16" fill="#e0f2eb"/><text x="65" y="440" class="h">按 MAE 选 E；按题设实际成本选 F。</text><text x="65" y="479" class="sm">先明确任务目标与错误代价，再确定评价指标。</text></svg>