<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="860" viewBox="0 0 1080 860"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:26px;font-weight:700}.t{font-size:22px}.sm{font-size:19px}</style><rect width="1080" height="860" fill="#f3f6fb"/><text x="45" y="58" class="h">同样的查全率与误报比例，查准率为什么不同？</text><text x="45" y="101" class="t">假设两批数据上：查全率均为 90%，假正例率均为 10%</text><rect x="40" y="135" width="480" height="465" rx="16" fill="white"/><text x="65" y="180" class="h">场景 A：坏瓜占一半</text><text x="65" y="235" class="t">实际坏瓜：100 个</text><text x="65" y="280" class="t">实际好瓜：100 个</text><path d="M65 305H495" stroke="#dce3ed"/><text x="65" y="350" class="t">找到坏瓜：100 × 90% = 90</text><text x="65" y="400" class="t">误报好瓜：100 × 10% = 10</text><text x="65" y="460" class="t">报出的疑似坏瓜：100 个</text><text x="65" y="515" class="t">查准率 = 90 / (90 + 10)</text><text x="65" y="565" class="h" fill="#087d69">= 90%</text><rect x="560" y="135" width="480" height="465" rx="16" fill="white"/><text x="585" y="180" class="h">场景 B：坏瓜只有 1%</text><text x="585" y="235" class="t">实际坏瓜：10 个</text><text x="585" y="280" class="t">实际好瓜：990 个</text><path d="M585 305H1015" stroke="#dce3ed"/><text x="585" y="350" class="t">找到坏瓜：10 × 90% = 9</text><text x="585" y="400" class="t">误报好瓜：990 × 10% = 99</text><text x="585" y="460" class="t">报出的疑似坏瓜：108 个</text><text x="585" y="515" class="t">查准率 = 9 / (9 + 99)</text><text x="585" y="565" class="h" fill="#087d69">= 约 8.3%</text><rect x="40" y="625" width="1000" height="185" rx="16" fill="#e0f2eb"/><text x="65" y="670" class="h">关键：10% 的误报比例，乘上大量好瓜，也会产生很多误报。</text><text x="65" y="720" class="t">ROC 点相同：(FPR, TPR) = (0.1, 0.9)</text><text x="65" y="766" class="t">P-R 点不同：(Recall, Precision) = (0.9, 0.9) 与 (0.9, 约 0.083)</text></svg>