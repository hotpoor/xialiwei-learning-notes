<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="840" viewBox="0 0 1080 840"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:27px;font-weight:700}.t{font-size:22px}.s{font-size:19px}</style><rect width="1080" height="840" fill="#f3f6fb"/><text x="40" y="55" class="h">西瓜书 · 当前知识地图</text><text x="40" y="95" class="t">从“学什么”到“怎么验证”，围绕真实任务判断模型</text><rect x="40" y="130" width="475" height="185" rx="16" fill="white"/><text x="62" y="175" class="h">01 学习的目标</text><text x="62" y="225" class="t">数据 → 学习算法 → 模型</text><text x="62" y="270" class="s">泛化 · 过拟合 · 假设与偏好</text><rect x="565" y="130" width="475" height="185" rx="16" fill="white"/><text x="587" y="175" class="h">02 公平的评估</text><text x="587" y="225" class="t">训练学 · 验证选 · 测试评估</text><text x="587" y="270" class="s">预处理边界 · 对象分组 · 时间顺序</text><rect x="40" y="345" width="475" height="185" rx="16" fill="white"/><text x="62" y="390" class="h">03 分类如何打分</text><text x="62" y="440" class="t">混淆矩阵 → P / R / FPR / F1</text><text x="62" y="485" class="s">阈值 · ROC / P-R · AUC · 类别比例</text><rect x="565" y="345" width="475" height="185" rx="16" fill="white"/><text x="587" y="390" class="h">04 回归如何打分</text><text x="587" y="440" class="t">MAE · MSE · RMSE</text><text x="587" y="485" class="s">单位 · 大误差 · 对称与非对称成本</text><rect x="40" y="560" width="475" height="185" rx="16" fill="white"/><text x="62" y="605" class="h">05 结果有多可靠</text><text x="62" y="655" class="t">一次领先 ≠ 未来保证领先</text><text x="62" y="700" class="s">5 折交叉验证：刚讲解，待独立作答</text><rect x="565" y="560" width="475" height="185" rx="16" fill="white"/><text x="587" y="605" class="h">06 复习的闭环</text><text x="587" y="655" class="t">看卡回忆 → 独立做题 → 查解析</text><text x="587" y="700" class="s">错题回到知识卡 → 再做变式题</text><text x="40" y="800" class="s">历史计算有 GPT 辅助，独立能力待复测；先理解含义，再练计算。</text></svg>