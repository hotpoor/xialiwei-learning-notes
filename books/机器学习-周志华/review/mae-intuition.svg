<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="830" viewBox="0 0 1080 830"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20304b}.h{font-size:27px;font-weight:700}.t{font-size:23px}.s{font-size:20px}</style><rect width="1080" height="830" fill="#f3f6fb"/><text x="40" y="55" class="h">先不背公式：MAE 在问“平均每次偏差多少？”</text><text x="40" y="101" class="t">两个瓜实际都重 5 kg，模型分别预测 4 kg、6 kg。</text><rect x="40" y="135" width="1000" height="230" rx="16" fill="white"/><text x="65" y="185" class="h">第一个瓜：少猜 1 kg</text><text x="575" y="185" class="h">第二个瓜：多猜 1 kg</text><path d="M140 245H440 M650 245H950" stroke="#c0cbd8" stroke-width="5"/><circle cx="140" cy="245" r="10" fill="#2870ba"/><circle cx="290" cy="245" r="10" fill="#087d69"/><circle cx="800" cy="245" r="10" fill="#087d69"/><circle cx="950" cy="245" r="10" fill="#2870ba"/><text x="115" y="290" class="s">预测4</text><text x="264" y="290" class="s">实际5</text><text x="774" y="290" class="s">实际5</text><text x="924" y="290" class="s">预测6</text><text x="65" y="337" class="t">偏差距离：1 kg</text><text x="575" y="337" class="t">偏差距离：1 kg</text><rect x="40" y="390" width="1000" height="155" rx="16" fill="#e0f2eb"/><text x="65" y="435" class="h">MAE = 这些偏差距离的平均值 = 1 kg</text><text x="65" y="482" class="t">含义：在这两个瓜上，每次预测平均偏差 1 kg。</text><text x="65" y="520" class="s">只看距离大小，不让“多猜”和“少猜”相互抵消。</text><rect x="40" y="570" width="1000" height="210" rx="16" fill="white"/><text x="65" y="615" class="h">MAE 有什么用？</text><text x="65" y="660" class="t">同一批瓜：甲的 MAE 1 kg，乙的 MAE 0.2 kg。</text><text x="65" y="705" class="t">若只比较平均偏差距离，乙更准，离实际重量更近。</text><text x="65" y="750" class="s">MAE 不告诉你总是高估还是低估，也不保证每个瓜都只差这个数。</text></svg>